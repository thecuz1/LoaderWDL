repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    - id: mixed-line-ending
      args: [--fix=lf]
      types_or: [c++, c, lua, yaml]
    - id: fix-byte-order-marker
      types_or: [c++, c, lua, yaml]
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: 'v22.1.8'
    hooks:
    - id: clang-format
      types_or: [c++, c]
