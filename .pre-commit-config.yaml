repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    - id: mixed-line-ending
      args: [--fix=lf]
      types_or: [c++, c, lua, yaml]
    - id: fix-byte-order-marker
      types_or: [c++, c, lua, yaml]
  - repo: https://github.com/Selene0623/pre-commit-hooks-indents
    rev: v0.0.2
    hooks:
    - id: indents-to-tabs
      args: ["--spaces=4"]
      types_or: ["c++", "c"]
    - id: indents-to-tabs
      args: ["--spaces=2"]
      types_or: ["lua"]
    - id: indents-to-spaces
      args: ["--spaces=2"]
      types_or: ["yaml"]
